<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Translation Lab · 20分钟翻译训练</title>
<style>
:root{--ink:#183153;--muted:#66758b;--blue:#2563eb;--green:#16845b;--red:#c9364f;--line:#d7e2ee;--bg:#f2f6fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 8%,#dcecff,transparent 30%),var(--bg);line-height:1.55}button,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.side{position:sticky;top:0;height:100vh;padding:30px 22px;background:#132844;color:#fff}.brand{font-size:1.35rem;font-weight:800}.brand small{display:block;margin-top:4px;color:#a9bbcf;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}.timer{margin:26px 0 20px;padding:14px 16px;border:1px solid #37506d;border-radius:14px;background:#1c3554}.timer b{font-size:1.25rem}.timer span{float:right;color:#9fb2c8}.nav{display:grid;gap:9px}.nav button{width:100%;border:0;border-radius:12px;padding:12px 13px;text-align:left;color:#dce7f3;background:transparent;cursor:pointer}.nav button:hover,.nav button.active{background:#284664;color:#fff}.nav button:disabled{opacity:.45;cursor:not-allowed}.mark{float:right}.stages{display:grid;gap:6px;margin:7px 0 16px 15px}.stages button{font-size:.82rem;padding:8px 10px}.progress-label{display:flex;justify-content:space-between;margin-top:24px;color:#b9c8d8}.progress{height:7px;margin-top:8px;border-radius:99px;background:#314963;overflow:hidden}.progress i{display:block;height:100%;background:#5ee0b6;transition:.3s}.main{padding:38px clamp(20px,5vw,68px) 70px}.wrap{max-width:980px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:.75rem;font-weight:800;letter-spacing:.14em}h1{margin:5px 0;font-size:clamp(2rem,4vw,3.2rem);line-height:1.1}.pill{height:max-content;padding:7px 12px;border-radius:999px;background:#e8f0ff;color:#2255b8;font-weight:750}.skill{display:flex;gap:14px;margin-bottom:25px;padding:15px 17px;border-left:4px solid #e8a317;border-radius:9px;background:#fff9e9}.skill b{display:block}.skill span{color:#706b5c;font-size:.9rem}.original{margin:8px 0 0;padding-top:8px;border-top:1px solid #eadfbe}.card{padding:clamp(20px,4vw,34px);border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 12px 36px rgba(24,49,83,.1)}.count{color:var(--muted);font-size:.85rem;font-weight:750}.match{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(300px,1.2fr);gap:24px;margin:15px 0 20px}.chunk{display:flex;align-items:center;padding:22px;border:1px solid #c9dcfa;border-radius:15px;background:#eef5ff;font-size:1.08rem;font-weight:750}.options{display:grid;gap:10px}.option{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.option:hover{border-color:#739df0}.option.correct{border-color:#44a981;background:#eaf8f2;color:#0b6747}.option.wrong{border-color:#e27486;background:#fff0f2;color:#a5263d}.feedback{min-height:28px;color:var(--muted)}.feedback.good{color:var(--green);font-weight:700}.feedback.bad{color:var(--red);font-weight:700}.source{padding:18px;border:1px solid var(--line);border-radius:13px;background:#f7f9fc}.answer{width:100%;min-height:145px;margin-top:14px;padding:15px;border:2px solid var(--line);border-radius:13px;resize:vertical}.answer:focus{border-color:#79a2ee;outline:0}.actions{display:flex;justify-content:space-between;margin-top:18px}.primary,.secondary{border:0;border-radius:11px;padding:11px 18px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf2f7;color:var(--ink)}.diff{display:none;margin-top:16px;padding:15px;border:1px solid #f1c3ca;border-radius:12px;background:#fff5f6;line-height:2}.diff.show{display:block}.badword{color:var(--red);font-weight:750;text-decoration:underline wavy}.success{text-align:center;padding:34px 15px}.check{display:grid;place-items:center;width:70px;height:70px;margin:0 auto 15px;border-radius:50%;background:#e5f7ef;color:var(--green);font-size:2rem}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.summary div{padding:18px;border:1px solid var(--line);border-radius:14px}.summary strong{display:block;color:var(--blue)}@media(max-width:760px){.app{display:block}.side{position:relative;height:auto;padding:18px}.nav{grid-template-columns:repeat(3,1fr)}.stages{display:none}.nav button{text-align:center;padding:9px 4px}.main{padding:24px 14px 45px}.match,.summary{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">Translation Lab<small>20-minute micro lesson</small></div><div class="timer"><b id="clock">20:00</b><span>课堂计时</span></div><nav id="nav" class="nav"></nav><div class="progress-label"><span>总进度</span><span id="progressText">0 / 3</span></div><div class="progress"><i id="progressBar"></i></div></aside><main class="main"><div id="app" class="wrap"></div></main></div>
<script>
const lessons=[
{title:'Sentence 1',verb:'REORDER',skill:'语序重组',note:'中文“条件 → 结果”可重组为英语“结果 + as long as + 条件”。',cn:'在网络空间，只要我们遵循现实世界中的礼貌规则，就有可能进行文明的沟通和交流。',answer:'In online spaces, it is possible to have civil communication and conversation as long as we follow the rules of politeness as we do in the real world.',chunks:[
['In online spaces','在网络空间',['在现实世界中','在网络空间','在公共场所','在人与人的交流中']],
['it is possible to have civil communication and conversation','有可能进行文明的沟通和交流',['应当停止网络上的交流','很难进行正常的交流','有可能进行文明的沟通和交流','有必要制定新的交流规则']],
['as long as we follow the rules of politeness as we do in the real world','只要我们像在现实世界中一样遵循礼貌规则',['即使现实生活中的规则已经改变','只要我们像在现实世界中一样遵循礼貌规则','因为网络世界没有礼貌规则','除非我们停止现实世界中的交流']]]},
{title:'Sentence 2',verb:'CONNECT',skill:'定语从句与信息重组',note:'用 that 修饰名词，用 which 补充说明整件事。',cn:'“非礼勿言”（not to say things that do not conform to rites）是几千年前孔子提出的行为规范之一，对现代社会人与人之间的沟通交流依然有着指导意义。',answer:'One of the norms of behavior that Confucius put forward thousands of years ago is not to say things that do not conform to rites, which still provides guidance on interpersonal communication in modern society.',chunks:[
['One of the norms of behavior that Confucius put forward thousands of years ago','几千年前孔子提出的行为规范之一',['孔子研究过的一种现代社会现象','几千年前孔子提出的行为规范之一','几千年来人们一直遵守的法律','孔子关于现代交流提出的建议']],
['is not to say things that do not conform to rites','“非礼勿言”',['是不要违背现代法律','“非礼勿言”','是应该在任何情况下保持沉默','是不要讨论传统礼仪']],
['which still provides guidance on interpersonal communication in modern society','对现代社会人与人之间的沟通交流依然有着指导意义',['在现代社会已经失去意义','主要用于研究中国古代历史','对现代社会人与人之间的沟通交流依然有着指导意义','可以代替现代社会的交流规则']]]},
{title:'Sentence 3',verb:'DIVIDE',skill:'拆译与并列结构',note:'一个中文长句可以拆成两个更清楚的英文句子。',cn:'网络成瘾会导致许多问题，很大一部分人会出现身体不适、与现实世界脱节、和家人起冲突等问题。（proportion; detached）',answer:'Internet addiction can cause many problems. A large proportion of those who are addicted have problems like poor health, being detached from the real world, and getting in conflict with family members.',chunks:[
['Internet addiction can cause many problems.','网络成瘾会导致许多问题',['网络成瘾可以解决很多问题','网络成瘾会导致许多问题','网络本身存在很多问题','人们应该避免使用网络']],
['A large proportion of those who are addicted have problems like','很大一部分网络成瘾者会出现……等问题',['少数使用互联网的人','所有网络使用者','很大一部分网络成瘾者会出现……等问题','网络成瘾者的家人']],
['poor health','身体不适 / 健康状况不佳',['身体不适 / 健康状况不佳','心情不好','缺乏社交能力','网络使用时间较长']],
['being detached from the real world','与现实世界脱节',['对现实世界感兴趣','与现实世界脱节','离开网络空间','了解现实社会']],
['getting in conflict with family members','和家人起冲突',['与家人交流','得到家人的帮助','和家人起冲突','和朋友发生争论']]]}
];
const state={lesson:0,stage:0,item:0,done:[false,false,false],stageDone:lessons.map(()=>[false,false,false]),attempts:[0,0,0]};
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){
 $('#nav').innerHTML=lessons.map((l,i)=>`<div><button class="${i===state.lesson?'active':''}" onclick="go(${i},0)">${l.title}<span class="mark">${state.done[i]?'✓':'→'}</span></button>${i===state.lesson?`<div class="stages">${['CN → EN','EN → CN','整句翻译'].map((x,j)=>`<button class="${j===state.stage?'active':''}" ${j>0&&!state.stageDone[i][j-1]?'disabled':''} onclick="go(${i},${j})">Stage ${j+1} · ${x}<span class="mark">${state.stageDone[i][j]?'✓':''}</span></button>`).join('')}</div>`:''}</div>`).join('');
 const n=state.done.filter(Boolean).length;$('#progressText').textContent=`${n} / 3`;$('#progressBar').style.width=n/3*100+'%'}
function go(i,j){if(j>0&&!state.stageDone[i][j-1])return;state.lesson=i;state.stage=j;state.item=0;render()}
function render(){nav();if(state.done.every(Boolean))return finish();const l=lessons[state.lesson],stage=state.stage;$('#app').innerHTML=`<div class="head"><div><div class="eyebrow">${l.verb} · STAGE ${stage+1}</div><h1>${stage<2?(stage?'English → 中文':'中文 → English'):'Whole-sentence Translation'}</h1></div><span class="pill">${l.title}</span></div><div class="skill"><div>💡</div><div><b>${l.skill}</b><span>${l.note}</span><p class="original"><b>中文原句：</b>${esc(l.cn)}</p></div></div><section class="card" id="work"></section>`;stage<2?match(l,stage):write(l)}
function match(l,stage){const c=l.chunks[state.item],left=stage?c[0]:c[1],correct=stage?c[1]:c[0];let choices=stage?c[2]:[correct,...l.chunks.map(x=>x[0]).filter(x=>x!==correct),'None of these expressions'].slice(0,4);if(!stage){const n=state.item%4;choices=choices.slice(n).concat(choices.slice(0,n))}$('#work').innerHTML=`<div class="count">语意群 ${state.item+1} / ${l.chunks.length}</div><div class="match"><div class="chunk">${esc(left)}</div><div class="options">${choices.map((x,i)=>`<button class="option" data-value="${esc(x)}" data-correct="${esc(correct)}" onclick="pick(this)"><b>${'ABCD'[i]}.</b> ${esc(x)}</button>`).join('')}</div></div><div id="feedback" class="feedback">选择最准确的对应表达。</div>`}
function pick(btn){const ok=btn.dataset.value===btn.dataset.correct;btn.classList.add(ok?'correct':'wrong');$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=ok?'正确！正在进入下一题……':'不正确，请再试一次。';if(ok){document.querySelectorAll('.option').forEach(b=>b.disabled=true);setTimeout(nextMatch,600)}}
function nextMatch(){const l=lessons[state.lesson];if(++state.item<l.chunks.length)return render();state.stageDone[state.lesson][state.stage]=true;state.stage++;state.item=0;render()}
function normalize(s){return s.toLowerCase().replace(/[“”‘’]/g,"'").replace(/[^a-z']+/g,' ').trim().split(/\s+/).filter(Boolean)}
function diffHtml(input,target){const got=normalize(input),want=normalize(target);return want.map((w,i)=>`<span class="${got[i]===w?'':'badword'}">${esc(got[i]||'___')}</span>`).join(' ')+(got.length>want.length?' <span class="badword">'+esc(got.slice(want.length).join(' '))+'</span>':'')}
function write(l){$('#work').innerHTML=`<div class="count">Translate the sentence.</div><p class="source">${esc(l.cn)}</p><label for="answer"><b>Your translation</b></label><textarea id="answer" class="answer" spellcheck="false" placeholder="在这里输入完整英文译文……"></textarea><div id="diff" class="diff"></div><div id="feedback" class="feedback">大小写、空格和标点差异不影响判定。</div><div class="actions"><button class="secondary" onclick="$('#answer').value=''">清空</button><button class="primary" onclick="checkAnswer()">Check My Translation</button></div>`}
function checkAnswer(){const l=lessons[state.lesson],input=$('#answer').value,ok=normalize(input).join(' ')===normalize(l.answer).join(' ');if(ok){state.stageDone[state.lesson][2]=true;state.done[state.lesson]=true;$('#work').innerHTML=`<div class="success"><div class="check">✓</div><h1>${l.title} Completed</h1><p>准确完成！你已掌握本题的 <b>${l.verb}</b> 策略。</p><button class="primary" onclick="continueLesson()">${state.lesson<2?'进入下一句 →':'查看学习总结'}</button></div>`;nav();return}state.attempts[state.lesson]++;$('#diff').classList.add('show');$('#diff').innerHTML='<b>对照定位：</b><br>'+diffHtml(input,l.answer);$('#feedback').className='feedback bad';$('#feedback').textContent=state.attempts[state.lesson]===1?'红色部分与目标译文不一致，请修改后再试。':`提示：注意本题的“${l.skill}”。`}
function continueLesson(){if(state.lesson<2){state.lesson++;state.stage=0;state.item=0;render()}else finish()}
function finish(){nav();$('#app').innerHTML=`<div class="card success"><div class="check">★</div><div class="eyebrow">LESSON COMPLETE</div><h1>Move · Connect · Divide</h1><div class="summary"><div><strong>REORDER</strong>调整信息的位置</div><div><strong>CONNECT</strong>建立信息的关系</div><div><strong>DIVIDE</strong>重新划分信息单位</div></div><p><b>Good translation is not word-for-word replacement.<br>It is the reorganization of meaning.</b></p></div>`}
let remaining=1200;setInterval(()=>{if(remaining>0)remaining--;$('#clock').textContent=`${String(remaining/60|0).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`},1000);render();
</script></body></html>
